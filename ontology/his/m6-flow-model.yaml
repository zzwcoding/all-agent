# =====================================================================
# HIS 医院数据报表域（his）· M6 流程模型（票 67 素材定稿版）
# ────────────────────────────────────────────────────────────────
# 素材：R13——PRD §1.3 业务流程说明（就诊全流程图文逐段对应）。
# 全仓首个真实 M6 业务主流程（bohai FLOW 为归因剧本/工作流）：患者就诊
# 端到端链路。开方/检查分支=GATEWAY（可并行，素材「├── 开药 └── 检查」）；
# 退号/退费为异常路径（§1.3 尾部「或退号/退费」），进 Dashboard 不主走流程。
# 状态集与分支条件系 Q2 推定，如实标注待 Owner。
# =====================================================================
model_type: FLOW
version: "1.0.0"
domain: his
flows:
  # [PRD §1.3 全文] 患者就诊全流程：挂号→候诊→接诊→诊断→开方/检查→收费→执行→完成
  - id: FLOW-HIS-001
    name: 患者就诊全流程
    description: >-
      患者到院就诊端到端流程（R13·PRD §1.3 流程图逐节点对应）。核心系统
      =HIS 源系统（COMMAND 行为实现层在源侧，本体登记 ought）；报表平台
      只消费其产出数据。退号（未接诊）与退药退费（已收费后）是两条异常
      路径，由 BH-HIS-CancelRegister/BH-HIS-RefundPrescription 独立承载，
      不进主流程编排。就诊状态集（Q2）由本流程各节点 postcondition 推定。
    flowType: COLLABORATION
    businessObjectRefs:
      - AGG-HIS-001
      - AGG-HIS-002
      - AGG-HIS-003
      - AGG-HIS-004
      - AGG-HIS-005
    roleRefs:
      - ROLE-HIS-001
      - ROLE-HIS-002
      - ROLE-HIS-003
    trigger:
      triggerType: MANUAL     # 患者到院触发
    startActivity: ACT-HIS-101
    endActivities:
      - ACT-HIS-111
    activities:
      - activityId: ACT-HIS-101
        name: 开始（患者到院）
        activityType: START
        nextActivities:
          - ACT-HIS-102
      # §1.3「挂号登记（register: 生成 case_number, 关联科室/医生）」
      - activityId: ACT-HIS-102
        name: 挂号登记
        activityType: BEHAVIOR_CALL
        behaviorRef: BH-HIS-Register
        nextActivities:
          - ACT-HIS-103
      # §1.3「候诊等待」——无系统行为，候诊队列由 HIS 源侧承载
      - activityId: ACT-HIS-103
        name: 候诊等待
        activityType: USER_TASK
        roleRef: ROLE-HIS-001
        nextActivities:
          - ACT-HIS-104
      # §1.3「医生接诊」入口（问诊开始）
      - activityId: ACT-HIS-104
        name: 医生接诊
        activityType: USER_TASK
        roleRef: ROLE-HIS-002
        nextActivities:
          - ACT-HIS-105
      # §1.3「问诊：书写病历」
      - activityId: ACT-HIS-105
        name: 书写病历
        activityType: BEHAVIOR_CALL
        behaviorRef: BH-HIS-WriteMedicalRecord
        nextActivities:
          - ACT-HIS-106
      # §1.3「诊断：开具诊断（关联 ICD-10）」
      - activityId: ACT-HIS-106
        name: 开具诊断
        activityType: BEHAVIOR_CALL
        behaviorRef: BH-HIS-Diagnose
        nextActivities:
          - ACT-HIS-107
      # §1.3「├── 开药 └── 检查」——二分支可并行（素材结构推定）
      - activityId: ACT-HIS-107
        name: 处置分支（开方/检查）
        activityType: GATEWAY
        conditionExpression: 医生决定开处方和/或检验检查（可并行）
        nextActivities:
          - ACT-HIS-108
          - ACT-HIS-109
      # §1.3「开药：开具处方（选择药品）」
      - activityId: ACT-HIS-108
        name: 开具处方
        activityType: BEHAVIOR_CALL
        behaviorRef: BH-HIS-Prescribe
        nextActivities:
          - ACT-HIS-110
      # §1.3「检查：开具检验申请（选择医技项目）」
      - activityId: ACT-HIS-109
        name: 开具检验申请
        activityType: BEHAVIOR_CALL
        behaviorRef: BH-HIS-RequestInspection
        nextActivities:
          - ACT-HIS-110
      # §1.3「收费结算（按支付方式）」——两分支汇合后统一收费
      - activityId: ACT-HIS-110
        name: 收费结算
        activityType: BEHAVIOR_CALL
        behaviorRef: BH-HIS-Settle
        nextActivities:
          - ACT-HIS-111
      # §1.3「取药 / 做检查 → 就诊结束」
      - activityId: ACT-HIS-111
        name: 就诊结束
        activityType: END
