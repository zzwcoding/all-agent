# =====================================================================
# HIS 医院数据报表域（his）· M2 行为模型（票 67 素材定稿版）
# ────────────────────────────────────────────────────────────────
# 素材：R13——PRD §1.3 就诊全流程（COMMAND 侧八行为）+ §6.1 六报表模块
#   18 API（QUERY 侧六行为，与 M7 一对一，依赖边单向 M7→M2）。
# 报表平台本身不写业务（ADS 由离线链路预聚合，细稿 §五）——QUERY 行为
#   全部是只读查询；COMMAND 行为登记的是 HIS 源系统操作（本体登记 ought，
#   实现层在源系统，属开放面如实注记）。
# =====================================================================
model_type: BEHAVIOR
version: "1.0.0"
domain: his
behaviors:
  # ── COMMAND 侧：就诊链路（PRD §1.3 流程图逐步对应）──
  # [§1.3「挂号登记」] 患者到院挂号，生成 case_number（AGG-HIS-001 起点）
  - id: BH-HIS-Register
    name: 挂号登记
    ownerEntity: AGG-HIS-001
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions: []
    postconditions:
      - field: visitStatus
        setValue: 挂号
    appliedRules: []
    requiredPermissions:
      - PERM-HIS-Register
  # [§1.3「候诊等待→医生接诊」] 医生调阅病历并书写（AGG-HIS-002 五维度载体）
  - id: BH-HIS-WriteMedicalRecord
    name: 书写病历
    ownerEntity: AGG-HIS-002
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - visitStatus=接诊中（Q2 状态集推定，待 Owner）
    postconditions: []
    appliedRules:
      - RULE-HIS-006    # 病历完整率口径复用面（书写即完整率判定点）
    requiredPermissions:
      - PERM-HIS-WriteMedicalRecord
  # [§1.3「诊断：开具诊断」] 关联 ICD-10 字典（AGG-HIS-003）
  - id: BH-HIS-Diagnose
    name: 开具诊断
    ownerEntity: AGG-HIS-003
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - caseRef 存在病历（§1.3 先问诊后诊断）
    postconditions: []
    appliedRules: []
    requiredPermissions:
      - PERM-HIS-Diagnose
  # [§1.3「开药：开具处方」] 选择药品字典（AGG-HIS-004）
  - id: BH-HIS-Prescribe
    name: 开具处方
    ownerEntity: AGG-HIS-004
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - caseRef 就诊状态=已诊断（Q2 推定）
    postconditions:
      - field: refundFlag
        setValue: "false"
    appliedRules: []
    requiredPermissions:
      - PERM-HIS-Prescribe
  # [§1.3「检查：开具检验申请」] 选择医技项目字典（AGG-HIS-005）
  - id: BH-HIS-RequestInspection
    name: 开具检验申请
    ownerEntity: AGG-HIS-005
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - caseRef 就诊状态=已诊断（Q2 推定）
    postconditions: []
    appliedRules: []
    requiredPermissions:
      - PERM-HIS-RequestInspection
  # [§1.3「收费结算」] 按支付方式收费（现金/银行卡/微信/支付宝/医保卡）
  - id: BH-HIS-Settle
    name: 收费结算
    ownerEntity: AGG-HIS-001
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - visitStatus=已开方 或 已诊断（无方直接结算，Q2 推定）
    postconditions:
      - field: visitStatus
        setValue: 已收费
    appliedRules:
      - RULE-HIS-002    # 支付方式占比合计校验（结算即校验点）
    requiredPermissions:
      - PERM-HIS-Settle
  # [PRD §1.3 尾部「或退号/退费」] 退号（未接诊前）
  - id: BH-HIS-CancelRegister
    name: 退号
    ownerEntity: AGG-HIS-001
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - visitStatus≠已完成（退号窗口素材未给，如实挂 Q4）
    postconditions:
      - field: visitStatus
        setValue: 已退号
    appliedRules:
      - RULE-HIS-003    # 退号率分子判定点
    requiredPermissions:
      - PERM-HIS-CancelRegister
  # [PRD §1.3「或退号/退费」+ §5.2.7 refund_presc] 退药退费（处方维度）
  - id: BH-HIS-RefundPrescription
    name: 退药退费
    ownerEntity: AGG-HIS-004
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - refundFlag=false（未退过）
    postconditions:
      - field: refundFlag
        setValue: "true"
    appliedRules:
      - RULE-HIS-005    # 处方退费率分子判定点
    requiredPermissions:
      - PERM-HIS-RefundPrescription
  # ── QUERY 侧：六报表模块（PRD §6.1 逐模块对应，与 M7 QR 一对一）──
  # [§6.1 模块一] 院长驾驶舱：KPI 卡+趋势+占比+TOP5+异常预警
  - id: BH-HIS-QueryDashboard
    name: 查询院长驾驶舱
    ownerEntity: AGG-HIS-001
    behaviorType: QUERY
    appliedRules:
      - RULE-HIS-001    # 退号率>10% 告警渲染判定点
      - RULE-HIS-003
      - RULE-HIS-005
    requiredPermissions:
      - PERM-HIS-QueryDashboard
  # [§6.1 模块二] 门诊运营：科室/医生排行+状态漏斗+明细
  - id: BH-HIS-QueryOutpatient
    name: 查询门诊运营
    ownerEntity: AGG-HIS-001
    behaviorType: QUERY
    appliedRules:
      - RULE-HIS-001
      - RULE-HIS-003
      - RULE-HIS-004
    requiredPermissions:
      - PERM-HIS-QueryOutpatient
  # [§6.1 模块三] 收费与结算：收入趋势+支付占比+均次费用
  - id: BH-HIS-QueryFinance
    name: 查询收费结算
    ownerEntity: AGG-HIS-001
    behaviorType: QUERY
    appliedRules:
      - RULE-HIS-002
      - RULE-HIS-004
    requiredPermissions:
      - PERM-HIS-QueryFinance
  # [§6.1 模块四] 药品处方：销售 TOP20+类型占比+退费率趋势
  - id: BH-HIS-QueryDrug
    name: 查询药品处方
    ownerEntity: AGG-HIS-004
    behaviorType: QUERY
    appliedRules:
      - RULE-HIS-005
    requiredPermissions:
      - PERM-HIS-QueryDrug
  # [§6.1 模块五] 疾病诊断：TOP20+ICD 分布+病历完整率
  - id: BH-HIS-QueryDisease
    name: 查询疾病诊断
    ownerEntity: AGG-HIS-003
    behaviorType: QUERY
    appliedRules:
      - RULE-HIS-006
    requiredPermissions:
      - PERM-HIS-QueryDisease
  # [§6.1 模块六] 患者画像：年龄性别金字塔+地域+复诊率
  - id: BH-HIS-QueryPatient
    name: 查询患者画像
    ownerEntity: AGG-HIS-001
    behaviorType: QUERY
    appliedRules:
      - RULE-HIS-007
    requiredPermissions:
      - PERM-HIS-QueryPatient
