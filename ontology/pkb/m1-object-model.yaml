# =====================================================================
# 个人知识库域（pkb）· M1 对象模型（票 58 定稿版，Owner Q2–Q10 签收 2026-09-22）
# ────────────────────────────────────────────────────────────────
# 素材：Owner 口述粗需求（docs/requirements/personal-weknora-细稿.md）+
#   拍板清单签收记录（docs/requirements/pkb-拍板清单-Q2-Q10.md）。
# 口径：本体只登记 ought/means（身份与引用），不存原文——条目正文以
#   contentRef 指针外挂（R11·TERMS 四层归属：「库存原始事实、本体存定义」）。
# 已裁口径：Q2 单聚合+sourceType / Q3 六值起步新增走提案 / Q8 书摘优先全文
#   可选 / Q10 双链（暂存→入册）。AI 只做格式转换，业务已由 Owner 签收。
# =====================================================================
model_type: OBJECT
version: "1.0.0"
domain: pkb
aggregates:
  - id: AGG-PKB-001
    name: 知识条目
    alias: KnowledgeItem
    aggregateType: AGGREGATE_ROOT
    description: >-
      个人知识库的被管理单元（Owner 原话「管理我日常的开发资料、想法、文档、书籍、
      技术感悟、工作业务等等」）。粒度已裁=单一聚合+sourceType 区分来源（Q2 签收
      2026-09-22；某类内容长出独立属性面时走提案拆分）。载体形态参照 Owner 既有
      资产：书籍全文 txt/书摘 txt/思维导图 png/概念 wiki 页（调研 §一#11）。
    lifecycle:
      - 暂存
      - 入册
    attributes:
      - name: title
        label: 标题
        type: String
        required: true
        description: 条目标题（身份性元数据，票 58 定稿）。
      - name: sourceType
        label: 来源类型
        type: String
        required: true
        description: >-
          来源类型（Q3 已裁 2026-09-22）：六值起步=开发资料/想法/文档/书籍/技术感悟/
          工作业务；保持 String 占位（值集未闭不建枚举），新增类型走提案池转 DICT 字典
          （字典项停用不删除）。
      - name: contentRef
        label: 内容载体引用
        type: String
        description: >-
          内容的文件路径或 URI 引用（条目正文不进本体仓，本体只登记引用）；
          Q8 已裁（2026-09-22）：书摘条目优先，全文挂载可选（contentRef 指向全文
          文件不强制）；内联短内容条目可空。
      - name: status
        label: 状态
        type: Enum
        required: true
        enumValues: [暂存, 入册]
        description: >-
          生命周期（Q10 已裁 2026-09-22 双链）：捕获链随手记直进「暂存」（低摩擦，
          不进检索/图谱/wiki 三管线）；整理入册后翻「入册」（进三管线消费）。
      - name: collectedAt
        label: 采集时间
        type: DateTime
        required: true
        description: 入库采集时间戳（身份性元数据，票 58 定稿）。
