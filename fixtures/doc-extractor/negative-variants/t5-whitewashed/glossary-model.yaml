model_type: GLOSSARY
version: "1.0.0"
domain: datagov
terms:
  - id: GLS-DATAGOV-001
    term: 数据 Owner
    aliases: []
    termType: 术语
    definition: 对某一数据资产全生命周期的质量与合规负第一责任的岗位（或指定角色）；每项数据资产有且仅有一个数据 Owner。
    relatedObjectRefs: []              # 无 M1 承载对象——不硬挂（草案零对象证据）
    status: 有效
    owner: 待 Owner 确认
    source: 文档 terms.md#T1
  - id: GLS-DATAGOV-002
    term: 质量阈值
    aliases: []
    termType: 口径词
    definition: 衡量数据质量是否达标的量化下限，含完整率、准确率、及时率三个分项，各分项阈值由数据 Owner 按资产级别设定；完整率分项被 RULE-DATAGOV-002 引为判据（95%）。
    relatedObjectRefs: []              # 无 M1 承载对象——不硬挂（草案零对象证据）
    status: 有效
    owner: 待 Owner 确认
    source: 文档 terms.md#T2
  - id: GLS-DATAGOV-003
    term: 备份策略
    aliases: []
    termType: 术语
    definition: 对数据资产执行备份的频率、保留期与恢复要求的规则集；核心数据必须有备份策略。
    relatedObjectRefs: []              # 无 M1 承载对象——不硬挂（草案零对象证据）
    status: 有效
    owner: 待 Owner 确认
    source: 文档 terms.md#T3
  - id: GLS-DATAGOV-004
    term: 数据分级
    aliases: []
    termType: 口径词
    definition: 按敏感程度对数据资产划分等级，分为公开、内部、敏感、核心四级；四级值集为 RULE-DATAGOV-001/005 的条件判据。
    relatedObjectRefs: []              # 无 M1 承载对象——不硬挂（草案零对象证据）
    status: 有效
    owner: 待 Owner 确认
    source: 文档 terms.md#T4
  - id: GLS-DATAGOV-005
    term: 数据管理员
    aliases: []
    termType: 禁用词
    definition: 数据 Owner 的旧称，自 2026 年起废弃，全部职责并入数据 Owner；现行文档一律使用「数据 Owner」，不得再以「数据管理员」指称。
    relatedObjectRefs: []              # 无 M1 承载对象——不硬挂（草案零对象证据）
    status: 有效
    owner: 待 Owner 确认
    source: 文档 terms.md#T5
  - id: GLS-DATAGOV-006
    term: 红线数据
    aliases: []
    termType: 术语
    definition: 仅限安全审计语境使用的称谓，指一经泄露即引发监管处罚的数据子集；日常治理文档与对外材料不得使用该称谓。
    relatedObjectRefs: []              # 无 M1 承载对象——不硬挂（草案零对象证据）
    status: 有效（限安全审计语境）
    owner: 待 Owner 确认
    source: 文档 terms.md#T6
