# =====================================================================
# 设备巡检管理域草案 · M1 对象模型（requirement-explorer 参照产物，票 30）
# 输入: fixtures/requirement-explorer/input/prd-fragment.md（粗 PRD 固定片段）
# ────────────────────────────────────────────────────────────────
# AI 只做格式转换，业务必须人确认。
# 覆盖纪律: 粗 PRD【】标记关键词逐个落三处之一（草案元素/开放问题/明示不建模），
#   逐词对照表见 expected-output/inspect-细稿.md 末节；含糊表述（时限口径、责任归属）
#   不硬化成结构，只进开放问题——「未覆盖必须变成问题」。
# 证据等级: 全部元素=粗 PRD 文字直译（需求面证据，非权威）；对象粒度/枚举值集/
#   关联方向均待 Owner 确认。
# =====================================================================
model_type: OBJECT
version: "1.0.0"
domain: inspect
aggregates:
  # [输入·业务对象 1] 设备（名词→对象候选）
  - id: AGG-INSPECT-001
    name: 设备
    alias: Equipment
    description: "粗 PRD 业务对象第 1 条直译。原文言明「设备台账已有（在既有系统里），本次只做巡检这一条线」——本域设备与既有台账的关系（引用/同步/只读镜像）粗 PRD 未给，待 Owner 确认。巡检周期口径见 GLS-INSPECT-001。"
    aggregateType: AGGREGATE_ROOT
    attributes:
      - { name: equipmentId, label: 设备编号, type: String, required: true, unique: true }   # unique：粗 PRD 明示「设备编号（唯一）」直译（票 34 注记）
      - { name: equipmentName, label: 设备名称, type: String, required: true }
      - { name: equipmentType, label: 设备类型, type: Enum, enumValues: [泵, 风机, 电机] }
      - { name: status, label: 设备状态, type: Enum, enumValues: [在用, 停用, 报废] }
      - { name: inspectCycle, label: 巡检周期, type: String }
  # [输入·业务对象 2] 巡检工单（名词→对象候选；一单挂一设备按原文直译成引用属性）
  - id: AGG-INSPECT-002
    name: 巡检工单
    alias: InspectionWorkOrder
    description: "粗 PRD 业务对象第 2 条直译：「一张工单挂一台设备」→ equipment 引用属性（方向/基数按原文单句直译，仍待 Owner 确认）。超期单判定判据见 RULE-INSPECT-001、术语见 GLS-INSPECT-002；「处理完把工单关闭」的闭环流转是开放问题 Q3——待 Owner 确认。"
    aggregateType: AGGREGATE_ROOT
    attributes:
      - { name: workOrderId, label: 工单编号, type: String, required: true, unique: true }   # unique：工程外推（粗 PRD 未明示唯一），待 Owner 确认（票 34 注记，审查 P3）
      - { name: equipment, label: 巡检设备, type: AggregateRootRef, required: true, targetAggregate: AGG-INSPECT-001 }
      - { name: planDate, label: 计划巡检日期, type: Date, required: true }
      - { name: inspectDate, label: 实际巡检日期, type: Date }
      - { name: result, label: 巡检结果, type: Enum, enumValues: [正常, 异常] }
      - { name: status, label: 工单状态, type: Enum, enumValues: [待执行, 已完成, 已关闭] }
      - { name: remark, label: 备注, type: String }
  # [输入·业务对象 3] 缺陷（名词→对象候选；从工单发现按原文「巡检中发现的问题」直译）
  - id: AGG-INSPECT-003
    name: 缺陷记录
    alias: DefectRecord
    description: "粗 PRD 业务对象第 3 条直译。处理时限（handleDeadline）只落属性占位，取值口径是开放问题 Q2（原文含糊，不硬化成规则）；处理人/关闭人属性是否立，待开放问题 Q3 收敛——均待 Owner 确认。"
    aggregateType: AGGREGATE_ROOT
    attributes:
      - { name: defectId, label: 缺陷编号, type: String, required: true, unique: true }   # unique：工程外推（粗 PRD 未明示唯一），待 Owner 确认（票 34 注记，审查 P3）
      - { name: workOrder, label: 发现工单, type: AggregateRootRef, required: true, targetAggregate: AGG-INSPECT-002 }
      - { name: description, label: 缺陷描述, type: String, required: true }
      - { name: level, label: 缺陷等级, type: Enum, enumValues: [一般, 严重, 紧急] }
      - { name: foundDate, label: 发现日期, type: Date, required: true }
      - { name: handleDeadline, label: 处理时限, type: Date }
# 无 aggregate_associations：粗 PRD 只有「一单挂一设备」「巡检中发现」两句归属表述，
#   按原文直译为聚合根引用属性（方向/基数原文已单句给定）；再多的关联即发明业务语义，
#   不建。主体/行为/查询统计零证据：M2/M5/M7 不产文件（manifest omittedModels）。
